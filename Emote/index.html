<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Teacher Emotion</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="emoicon-192.png">


<style>

* {
    box-sizing: border-box;
}


html,
body {
    width: 100%;
    height: 100%;
}


body {

    margin: 0;

    min-height: 100vh;

    background: black;

    color: white;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

}


/* =========================
   MAIN EMOTION DISPLAY
   ========================= */

#display {

    text-align: center;

    padding: 20px;

}


#emoji {

    font-size: 150px;

    line-height: 1;

}


#emotion {

    margin-top: 20px;

    font-size: 45px;

    font-weight: bold;

}


/* =========================
   FLOATING EMOTION BUTTON
   ========================= */

#menuButton {

    position: fixed;

    right: 25px;

    bottom: 90px;

    width: 70px;

    height: 70px;

    border-radius: 50%;

    border: none;

    background: white;

    color: black;

    font-size: 36px;

    cursor: pointer;

    box-shadow:
        0 0 20px white;

    z-index: 1001;

    transition:
        transform 0.2s,
        box-shadow 0.2s;

}


#menuButton:hover {

    transform: scale(1.08);

    box-shadow:
        0 0 30px white;

}


#menuButton:active {

    transform: scale(0.95);

}


/* =========================
   EMOTION MENU
   ========================= */

#menu {

    display: none;

    position: fixed;

    right: 20px;

    bottom: 170px;

    width: 320px;

    max-width: calc(100vw - 40px);

    max-height: calc(100vh - 230px);

    overflow-y: auto;

    background: #111;

    border-radius: 25px;

    padding: 20px;

    box-shadow:
        0 0 30px grey;

    z-index: 1000;

}


#menu h2 {

    text-align: center;

    margin-top: 0;

    margin-bottom: 15px;

}


.emojiChoice {

    display: inline-block;

    font-size: 45px;

    margin: 8px;

    cursor: pointer;

    transition:
        transform 0.15s;

}


.emojiChoice:hover {

    transform: scale(1.2);

}


button.word {

    width: 100%;

    margin: 7px 0;

    padding: 14px;

    border-radius: 15px;

    border: none;

    background: #333;

    color: white;

    font-size: 18px;

    cursor: pointer;

    transition:
        background 0.15s,
        transform 0.15s;

}


button.word:hover {

    background: #444;

}


button.word:active {

    background: #666;

    transform: scale(0.98);

}


/* =========================
   BOTTOM APP NAVIGATION
   ========================= */

#appNavigation {

    position: fixed;

    left: 0;

    right: 0;

    bottom: 0;

    height: 65px;

    background: rgba(18, 18, 18, 0.96);

    border-top: 1px solid #333;

    display: flex;

    justify-content: center;

    align-items: stretch;

    z-index: 2000;

    backdrop-filter: blur(10px);

    -webkit-backdrop-filter: blur(10px);

}


.navItem {

    flex: 1;

    max-width: 180px;

    border: none;

    background: transparent;

    color: #aaa;

    text-decoration: none;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 2px;

    font-size: 11px;

    cursor: pointer;

    transition:
        background 0.15s,
        color 0.15s;

}


.navItem .navIcon {

    font-size: 24px;

    line-height: 1;

}


.navItem:hover {

    background: #222;

    color: white;

}


.navItem.active {

    background: #222;

    color: white;

}


.navItem.active .navIcon {

    transform: scale(1.08);

}


/* =========================
   MOBILE ADJUSTMENTS
   ========================= */

@media (max-width: 600px) {

    #emoji {

        font-size: 110px;

    }


    #emotion {

        font-size: 32px;

    }


    #menuButton {

        width: 60px;

        height: 60px;

        right: 15px;

        bottom: 78px;

        font-size: 30px;

    }


    #menu {

        right: 10px;

        bottom: 145px;

        width: calc(100vw - 20px);

    }


    #appNavigation {

        height: 62px;

    }


    .navItem {

        font-size: 10px;

    }


    .navItem .navIcon {

        font-size: 22px;

    }

}

</style>

</head>


<body>


<!-- =========================
     MAIN EMOTION
     ========================= -->

<div id="display">

    <div id="emoji">
        🙂
    </div>

    <div id="emotion">
        Ready
    </div>

</div>


<!-- =========================
     FLOATING EMOTION BUTTON
     ========================= -->

<button id="menuButton" aria-label="Choose teacher emotion">
    😊
</button>


<!-- =========================
     EMOTION MENU
     ========================= -->

<div id="menu">

    <h2>
        How do I feel?
    </h2>


    <div>

        <span
            class="emojiChoice"
            onclick="selectEmoji('😀','happy')">
            😀
        </span>


        <span
            class="emojiChoice"
            onclick="selectEmoji('🤩','excited')">
            🤩
        </span>


        <span
            class="emojiChoice"
            onclick="selectEmoji('😑','neutral')">
            😑
        </span>


        <span
            class="emojiChoice"
            onclick="selectEmoji('🙁','sad')">
            🙁
        </span>


        <span
            class="emojiChoice"
            onclick="selectEmoji('😡','angry')">
            😡
        </span>

    </div>


    <div id="words"></div>

</div>


<!-- =========================
     BOTTOM APP NAVIGATION
     ========================= -->

<nav id="appNavigation" aria-label="Classroom Tools">
    <a class="navItem" href="../index.html">
        <span class="navIcon">🏠</span>
        <span>Tools</span>
    </a>

    <a class="navItem" href="../namepicker/index.html">
        <span class="navIcon">🎲</span>
        <span>Names</span>
    </a>

    <a class="navItem active" href="../emote/index.html">
        <span class="navIcon">😀</span>
        <span>Emote</span>
    </a>

    <a class="navItem" href="../classpointsystem/index.html">
        <span class="navIcon">⭐</span>
        <span>Points</span>
    </a>
</nav>

<script>


/* =========================
   EMOTION WORDS
   ========================= */

const emotions = {


    happy: [

        "Joyful",
        "Satisfied",
        "Proud",
        "Confident",
        "Fulfilled",
        "Appreciated"

    ],


    excited: [

        "Impressed",
        "Inspired",
        "Amazed",
        "Enthusiastic",
        "Encouraged",
        "Motivated",
        "Proud"

    ],


    neutral: [

        "Tired",
        "Drained",
        "Unsure",
        "Calm",
        "Reflective",
        "Uninspired"

    ],


    sad: [

        "Concerned",
        "Worried",
        "Disappointed",
        "Discouraged",
        "Disheartened",
        "Frustrated"

    ],


    angry: [

        "Annoyed",
        "Irritated",
        "Upset",
        "Overwhelmed",
        "Stressed",
        "Impatient"

    ]

};



let currentEmoji = "🙂";


/* =========================
   OPEN / CLOSE MENU
   ========================= */

document
.getElementById("menuButton")
.onclick = function() {

    const menu =
        document.getElementById("menu");

    if (menu.style.display === "block") {

        menu.style.display = "none";

    } else {

        menu.style.display = "block";

    }

};


/* =========================
   SELECT EMOJI
   ========================= */

function selectEmoji(icon, type) {

    currentEmoji = icon;

    const box =
        document.getElementById("words");

    box.innerHTML = "";


    emotions[type].forEach(word => {

        const button =
            document.createElement("button");

        button.className = "word";

        button.innerHTML = word;


        button.onclick = function() {

            document
                .getElementById("emoji")
                .innerHTML = currentEmoji;


            document
                .getElementById("emotion")
                .innerHTML = word;


            localStorage.setItem(
                "emoji",
                currentEmoji
            );


            localStorage.setItem(
                "emotion",
                word
            );


            document
                .getElementById("menu")
                .style.display = "none";

        };


        box.appendChild(button);

    });

}


/* =========================
   LOAD SAVED EMOTION
   ========================= */

window.onload = function() {

    document
        .getElementById("emoji")
        .innerHTML =
        localStorage.getItem("emoji")
        ||
        "🙂";


    document
        .getElementById("emotion")
        .innerHTML =
        localStorage.getItem("emotion")
        ||
        "Ready";

};


/* =========================
   PWA OFFLINE SUPPORT
   ========================= */

if ("serviceWorker" in navigator) {

    window.addEventListener("load", function() {

        navigator.serviceWorker
            .register("sw.js")
            .catch(function(error) {

                console.warn(
                    "Service worker registration failed:",
                    error
                );

            });

    });

}

</script>


</body>

</html>
