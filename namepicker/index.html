<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>The Great Summoner</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <meta
        name="theme-color"
        content="#1a0033"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="The Great Summoner"
    >

    <link
        rel="apple-touch-icon"
        href="icon-192.png"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Quicksand:wght@500;700&display=swap"
        rel="stylesheet"
    >


    <style>

        :root {
            --magic-purple: #1a0033;
            --magic-gold: #ffd700;
            --text: #f0e6ff;
        }


        /*
         * IMPORTANT:
         * Give the HTML element the same background as the body.
         * This prevents iPad from showing a white strip in the
         * top safe-area/status-bar region.
         */

        html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: var(--magic-purple);
        }


        * {
            box-sizing: border-box;
        }


        body {
            font-family:
                'Quicksand',
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #2d004d 0%,
                    #10002b 100%
                );

            margin: 0;

            padding: 0;

            width: 100%;

            min-height: 100vh;

            min-height: 100dvh;

            color: var(--text);

            overflow: hidden;

            position: relative;

            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;

            /*
             * Bottom space for navigation.
             * Safe-area space is included separately.
             */

            padding-bottom:
                calc(
                    75px +
                    env(safe-area-inset-bottom)
                );
        }


        #classTitle {
            font-family:
                'Cinzel Decorative',
                Georgia,
                serif;

            color: var(--magic-gold);

            font-size: 2.5rem;

            margin: 0;

            text-shadow:
                0 0 15px rgba(255, 215, 0, 0.5);

            text-align: center;

            white-space: nowrap;
        }


        .editable-element {
            position: absolute;

            user-select: none;

            /*
             * IMPORTANT:
             * "none" disables browser touch gestures, including
             * pinch-to-zoom.
             *
             * "manipulation" allows normal touch gestures while
             * still keeping the interface responsive.
             */

            touch-action: manipulation;

            z-index: 5;

            display: inline-block;

            transform-origin: center center;
        }


        .magic-bag {
            font-size: 10rem;

            cursor: pointer;

            text-shadow:
                0 0 30px rgba(162, 155, 254, 0.6);

            transition:
                transform 0.1s linear;
        }


        .shaking {
            animation:
                magicShake 0.06s infinite alternate;

            will-change: transform;
        }


        @keyframes magicShake {

            0% {
                transform:
                    translate3d(2px, 1px, 0)
                    rotate(0deg);
            }

            100% {
                transform:
                    translate3d(-2px, -1px, 0)
                    rotate(-1deg);
            }

        }


        #resultDisplay {
            font-family:
                'Cinzel Decorative',
                Georgia,
                serif;

            font-size: 4rem;

            color: white;

            text-align: center;

            text-shadow:
                0 0 10px #fff,
                0 0 20px var(--magic-gold),
                0 0 40px var(--magic-gold);

            opacity: 0;

            white-space: nowrap;

            pointer-events: none;

            z-index: 10;

            transform-origin: center center;

            transition:
                transform 0.4s
                cubic-bezier(
                    0.175,
                    0.885,
                    0.32,
                    1.275
                ),
                opacity 0.4s linear;
        }


        .editable-element.layout-mode-active {
            outline:
                2px dashed var(--magic-gold) !important;

            background:
                rgba(255, 255, 215, 0.15) !important;

            pointer-events: auto !important;

            cursor: move !important;

            /*
             * When Layout Mode is active, the JavaScript
             * drag handlers take control of the touch movement.
             */
            touch-action: none;
        }


        #layoutBanner {
            display: none;

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            background:
                linear-gradient(
                    to bottom,
                    #ffaa00,
                    #cc7a00
                );

            color: #000;

            padding: 12px;

            text-align: center;

            font-weight: bold;

            z-index: 999;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.5);

            font-size: 1.1rem;
        }


        .sparkle {
            position: absolute;

            background: white;

            border-radius: 50%;

            pointer-events: none;

            animation:
                fly 1s forwards;

            z-index: 11;
        }


        @keyframes fly {

            to {
                transform:
                    translate3d(
                        var(--x),
                        var(--y),
                        0
                    );

                opacity: 0;
            }

        }


        .controls {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            justify-content: center;

            background:
                rgba(0,0,0,0.4);

            padding: 12px;

            border-radius: 12px;

            backdrop-filter: blur(5px);

            border:
                1px solid
                rgba(255,215,0,0.1);
        }


        .btn {
            background:
                rgba(255, 255, 255, 0.05);

            border:
                2px solid
                var(--magic-gold);

            color:
                var(--magic-gold);

            padding:
                10px 20px;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            user-select: none;

            font-size: 1rem;
        }


        .btn:hover {
            background:
                var(--magic-gold);

            color:
                var(--magic-purple);
        }


        .stats {
            position: fixed;

            top: 20px;

            left: 20px;

            font-size: 0.8rem;

            opacity: 0.6;

            user-select: none;

            z-index: 1;
        }


        .modal-overlay {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0,0,0,0.9);

            z-index: 100;

            justify-content: center;

            align-items: center;
        }


        .modal {
            background:
                var(--magic-purple);

            padding: 30px;

            border-radius: 20px;

            border:
                2px solid
                var(--magic-gold);

            width: 90%;

            max-width: 500px;

            max-height: 85vh;

            overflow-y: auto;
        }


        input,
        textarea,
        select {
            width: 100%;

            background: #000;

            color: #fff;

            border:
                1px solid
                var(--magic-gold);

            padding: 10px;

            margin-bottom: 15px;

            box-sizing: border-box;

            font-family: sans-serif;

            font-size: 16px;
        }


        .slider-group {
            margin: 20px 0;

            padding: 10px;

            background:
                rgba(255,255,255,0.05);

            border-radius: 10px;
        }


        .list-item {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 10px;

            border-bottom:
                1px solid
                rgba(255,215,0,0.2);
        }


        .list-item:hover {
            background:
                rgba(255,215,0,0.1);
        }


        .list-info {
            cursor: pointer;

            flex-grow: 1;
        }


        .delete-btn {
            color: #ff4d4d;

            cursor: pointer;

            font-weight: bold;

            padding: 5px 10px;

            margin-left: 10px;
        }


        /* =========================================
           BOTTOM APP NAVIGATION
           ========================================= */

        #appNavigation {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height:
                calc(
                    65px +
                    env(safe-area-inset-bottom)
                );

            background:
                rgba(18, 18, 18, 0.96);

            border-top:
                1px solid #333;

            display: flex;

            justify-content: center;

            align-items: stretch;

            z-index: 2000;

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            padding-bottom:
                env(safe-area-inset-bottom);
        }


        .navItem {
            flex: 1;

            max-width: 180px;

            border: none;

            background: transparent;

            color: #aaa;

            text-decoration: none;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 2px;

            font-size: 11px;

            cursor: pointer;

            transition:
                background 0.15s,
                color 0.15s;
        }


        .navItem .navIcon {
            font-size: 24px;

            line-height: 1;
        }


        .navItem:hover {
            background: #222;

            color: white;
        }


        .navItem.active {
            background: #222;

            color: white;
        }


        .navItem.active .navIcon {
            transform: scale(1.08);
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 600px) {

            #classTitle {
                font-size: 2rem;
            }


            .stats {
                top: 10px;
                left: 10px;
            }


            #appNavigation {
                height:
                    calc(
                        62px +
                        env(safe-area-inset-bottom)
                    );
            }


            .navItem {
                font-size: 10px;
            }


            .navItem .navIcon {
                font-size: 22px;
            }

        }

    </style>


    <script>

        if ('serviceWorker' in navigator) {

            window.addEventListener('load', () => {

                navigator.serviceWorker
                    .register('./service-worker.js')
                    .catch(err =>
                        console.warn(
                            'Service worker registration failed:',
                            err
                        )
                    );

            });

        }

    </script>

</head>


<body>

    <!-- =========================================

    <div

                style="
                    font-family:'Cinzel Decorative';
                    color:var(--magic-gold);

                ">

            </label>


            <div

    <script>

        let allData =
            JSON.parse(
                localStorage.getItem(
                    'summonerData'
                )
            ) || {};


        let currentClassName =
            localStorage.getItem(
                'currentClass'
            ) || "";


        let fontSize =
            localStorage.getItem(
                'summonerFontSize'
            ) || "4";


        let bagSize =
            localStorage.getItem(
                'summonerBagSize'
            ) || "10";


        let titleSize =
            localStorage.getItem(
                'summonerTitleSize'
            ) || "2.5";


        let remaining = [];


        let removeMode = false;


        let isLayoutMode = false;


        let positions =
            JSON.parse(
                localStorage.getItem(
                    'summonerPositions'
                )
            ) || {};


        let audioCtx = null;

        let audioBuffer = null;


        const soundUrl =
            "47660826-drum-roll-sound-effect-278576.mp3";


        function initAudio() {

            if (audioCtx) return;


            audioCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            fetch(soundUrl)

                .then(
                    response =>
                        response.arrayBuffer()
                )

                .then(
                    data =>
                        audioCtx.decodeAudioData(data)
                )

                .then(
                    buffer => {
                        audioBuffer = buffer;
                    }
                )

                .catch(
                    err =>
                        console.log(
                            "Web Audio Context initialized."
                        )
                );

        }


        function playMagicSound() {

            if (!audioCtx || !audioBuffer)
                return;


            if (
                audioCtx.state ===
                'suspended'
            ) {

                audioCtx.resume();

            }


            let source =
                audioCtx.createBufferSource();


            source.buffer =
                audioBuffer;


            source.connect(
                audioCtx.destination
            );


            source.start(0);

        }


        function init() {

            if (
                currentClassName &&
                allData[currentClassName]
            ) {

                loadClass(
                    currentClassName
                );

            }


            changeFontSize(fontSize);

            changeBagSize(bagSize);

            changeTitleSize(titleSize);

            applySavedPositions();

            renderSavedLists();

            setupDraggable();


            [
                'click',
                'touchstart'
            ].forEach(evt => {

                document.addEventListener(
                    evt,
                    () => {

                        initAudio();

                    },
                    {
                        once: true
                    }
                );

            });

        }


        function applySavedPositions() {

            const w =
                window.innerWidth;


            const h =
                window.innerHeight;


            const defaults = {

                classTitle: {
                    left:
                        (w / 2) + "px",

                    top:
                        "50px"
                },


                magicBag: {
                    left:
                        (w / 2 - 80) + "px",

                    top:
                        (h * 0.45) + "px"
                },


                resultDisplay: {
                    left:
                        (w / 2) + "px",

                    top:
                        (h * 0.22) + "px"
                },


                controlsWrapper: {
                    left:
                        (w / 2 - 240) + "px",

                    top:
                        (h * 0.85) + "px"
                }

            };


            Object.keys(defaults)
                .forEach(id => {

                    const el =
                        document.getElementById(id);


                    if (el) {

                        if (
                            positions[id] &&
                            positions[id].left
                        ) {

                            el.style.left =
                                positions[id].left;

                            el.style.top =
                                positions[id].top;

                        } else {

                            el.style.left =
                                defaults[id].left;

                            el.style.top =
                                defaults[id].top;

                        }

                    }

                });


            document
                .getElementById(
                    'resultDisplay'
                )
                .style.transform =
                "translate(-50%, -50%) scale(1)";


            document
                .getElementById(
                    'classTitle'
                )
                .style.transform =
                "translate(-50%, 0) scale(1)";

        }


        function changeFontSize(val) {

            fontSize = val;


            document
                .getElementById(
                    'resultDisplay'
                )
                .style.fontSize =
                val + 'rem';


            document
                .getElementById(
                    'sizeVal'
                )
                .innerText =
                val + 'rem';


            document
                .getElementById(
                    'fontSizeSlider'
                )
                .value =
                val;


            localStorage.setItem(
                'summonerFontSize',
                val
            );

        }


        function changeBagSize(val) {

            bagSize = val;


            document
                .getElementById(
                    'magicBag'
                )
                .style.fontSize =
                val + 'rem';


            document
                .getElementById(
                    'bagSizeVal'
                )
                .innerText =
                val + 'rem';


            document
                .getElementById(
                    'bagSizeSlider'
                )
                .value =
                val;


            localStorage.setItem(
                'summonerBagSize',
                val
            );

        }


        function changeTitleSize(val) {

            titleSize = val;


            document
                .getElementById(
                    'classTitle'
                )
                .style.fontSize =
                val + 'rem';


            document
                .getElementById(
                    'titleSizeVal'
                )
                .innerText =
                val + 'rem';


            document
                .getElementById(
                    'titleSizeSlider'
                )
                .value =
                val;


            localStorage.setItem(
                'summonerTitleSize',
                val
            );

        }


        function toggleLayoutMode() {

            isLayoutMode =
                !isLayoutMode;


            const btn =
                document.getElementById(
                    'layoutModeBtn'
                );


            const elements =
                document.querySelectorAll(
                    '.editable-element'
                );


            const display =
                document.getElementById(
                    'resultDisplay'
                );


            const banner =
                document.getElementById(
                    'layoutBanner'
                );


            if (isLayoutMode) {

                banner.style.display =
                    "block";


                btn.innerText =
                    "🔒 Lock Positions (Saving)";


                btn.style.backgroundColor =
                    "var(--magic-gold)";


                btn.style.color =
                    "var(--magic-purple)";


                elements.forEach(
                    el =>
                        el.classList.add(
                            'layout-mode-active'
                        )
                );


                display.style.transition =
                    "none";


                display.style.transform =
                    "translate(-50%, -50%) scale(1)";


                if (
                    display.innerText ===
                    "???"
                ) {

                    display.innerText =
                        "[NAME TARGET SLOT]";

                }


                display.style.opacity =
                    "0.7";


                toggleModal(false);

            } else {

                banner.style.display =
                    "none";


                btn.innerText =
                    "📐 Turn On Move/Drag Mode";


                btn.style.backgroundColor =
                    "transparent";


                btn.style.color =
                    "var(--magic-gold)";


                elements.forEach(
                    el =>
                        el.classList.remove(
                            'layout-mode-active'
                        )
                );


                if (
                    display.innerText ===
                    "[NAME TARGET SLOT]"
                ) {

                    display.innerText =
                        "???";

                    display.style.opacity =
                        "0";

                }


                localStorage.setItem(
                    'summonerPositions',
                    JSON.stringify(
                        positions
                    )
                );

            }

        }


        function toggleModal(s) {

            if (
                isLayoutMode &&
                s
            ) {

                toggleLayoutMode();

            }


            document
                .getElementById(
                    'settingsModal'
                )
                .style.display =
                s ? 'flex' : 'none';


            if (s)
                renderSavedLists();

        }


        function setupDraggable() {

            const elements =
                document.querySelectorAll(
                    '.editable-element'
                );


            elements.forEach(el => {

                let active = false;

                let offsetX,
                    offsetY;


                el.addEventListener(
                    'touchstart',
                    dragStart,
                    {
                        passive: false
                    }
                );


                el.addEventListener(
                    'touchend',
                    dragEnd,
                    {
                        passive: false
                    }
                );


                el.addEventListener(
                    'touchmove',
                    drag,
                    {
                        passive: false
                    }
                );


                el.addEventListener(
                    'mousedown',
                    dragStart
                );


                el.addEventListener(
                    'mouseup',
                    dragEnd
                );


                el.addEventListener(
                    'mousemove',
                    drag
                );


                function dragStart(e) {

                    if (!isLayoutMode)
                        return;


                    if (
                        el.id ===
                            "controlsWrapper" &&
                        e.target.tagName ===
                            "BUTTON"
                    )
                        return;


                    active = true;


                    let clientX =
                        e.type ===
                        "touchstart"

                            ? e.touches[0].clientX

                            : e.clientX;


                    let clientY =
                        e.type ===
                        "touchstart"

                            ? e.touches[0].clientY

                            : e.clientY;


                    const rect =
                        el.getBoundingClientRect();


                    if (
                        el.id ===
                            "resultDisplay" ||
                        el.id ===
                            "classTitle"
                    ) {

                        offsetX =
                            clientX -
                            (
                                rect.left +
                                rect.width / 2
                            );


                        offsetY =
                            clientY -
                            rect.top;

                    } else {

                        offsetX =
                            clientX -
                            rect.left;


                        offsetY =
                            clientY -
                            rect.top;

                    }

                }


                function dragEnd() {

                    if (!active)
                        return;


                    active = false;


                    positions[el.id] = {

                        left:
                            el.style.left,

                        top:
                            el.style.top

                    };


                    localStorage.setItem(
                        'summonerPositions',
                        JSON.stringify(
                            positions
                        )
                    );

                }


                function drag(e) {

                    if (
                        !active ||
                        !isLayoutMode
                    )
                        return;


                    e.preventDefault();


                    let clientX =
                        e.type ===
                        "touchmove"

                            ? e.touches[0].clientX

                            : e.clientX;


                    let clientY =
                        e.type ===
                        "touchmove"

                            ? e.touches[0].clientY

                            : e.clientY;


                    el.style.left =
                        (
                            clientX -
                            offsetX
                        ) + "px";


                    el.style.top =
                        (
                            clientY -
                            offsetY
                        ) + "px";

                }

            });

        }


        function prepareEdit(name) {

            document
                .getElementById(
                    'newClassName'
                )
                .value =
                name;


            document
                .getElementById(
                    'bulkInput'
                )
                .value =
                allData[name].join('\n');


            document
                .getElementById(
                    'formActionLabel'
                )
                .innerText =
                "Editing: " + name;


            loadClass(name);

        }


        function clearForm() {

            document
                .getElementById(
                    'newClassName'
                )
                .value = "";


            document
                .getElementById(
                    'bulkInput'
                )
                .value = "";


            document
                .getElementById(
                    'formActionLabel'
                )
                .innerText =
                "Create New Class";

        }


        function saveList() {

            const name =
                document
                    .getElementById(
                        'newClassName'
                    )
                    .value
                    .trim();


            const input =
                document
                    .getElementById(
                        'bulkInput'
                    )
                    .value;


            if (
                !name ||
                !input
            )
                return alert(
                    "Please enter a name and student list!"
                );


            const studentArray =
                input
                    .split(/[,\n]/)
                    .map(
                        s => s.trim()
                    )
                    .filter(
                        s => s !== ""
                    );


            allData[name] =
                studentArray;


            localStorage.setItem(
                'summonerData',
                JSON.stringify(
                    allData
                )
            );


            loadClass(name);

            renderSavedLists();

            clearForm();

        }


        function loadClass(name) {

            currentClassName =
                name;


            localStorage.setItem(
                'currentClass',
                name
            );


            document
                .getElementById(
                    'classTitle'
                )
                .innerText =
                name.toUpperCase();


            remaining =
                [
                    ...allData[name]
                ];


            updateStats();


            document
                .getElementById(
                    'resultDisplay'
                )
                .style.opacity =
                "0";

        }


        function deleteList(
            name,
            event
        ) {

            event.stopPropagation();


            if (
                confirm(
                    `Delete "${name}" permanently?`
                )
            ) {

                delete allData[name];


                localStorage.setItem(
                    'summonerData',
                    JSON.stringify(
                        allData
                    )
                );


                if (
                    currentClassName ===
                    name
                ) {

                    currentClassName =
                        "";


                    document
                        .getElementById(
                            'classTitle'
                        )
                        .innerText =
                        "SELECT A CLASS";


                    remaining = [];

                }


                renderSavedLists();

                updateStats();

                clearForm();

            }

        }


        function renderSavedLists() {

            const container =
                document
                    .getElementById(
                        'savedListsContainer'
                    );


            container.innerHTML =
                "";


            const keys =
                Object.keys(
                    allData
                );


            if (
                keys.length === 0
            ) {

                container.innerHTML =
                    "<p style='opacity:0.5; padding:10px;'>No scrolls found...</p>";


                return;

            }


            keys.forEach(key => {

                const div =
                    document.createElement(
                        'div'
                    );


                div.className =
                    "list-item";


                div.innerHTML = `

                    <div
                        class="list-info"
                        onclick="prepareEdit('${key}')">

                        <strong>
                            📜 ${key}
                        </strong>

                        <br>

                        <small>
                            ${allData[key].length} Names
                        </small>

                    </div>


                    <span
                        class="delete-btn"
                        onclick="deleteList('${key}', event)">

                        ✕

                    </span>

                `;


                container.appendChild(
                    div
                );

            });

        }


        function toggleMode() {

            removeMode =
                !removeMode;


            document
                .getElementById(
                    'modeBtn'
                )
                .innerText =
                removeMode
                    ? "Mode: Cycle Out"
                    : "Mode: Keep";

        }


        function resetHat() {

            if (!currentClassName)
                return;


            remaining =
                [
                    ...allData[
                        currentClassName
                    ]
                ];


            document
                .getElementById(
                    'resultDisplay'
                )
                .style.opacity =
                "0";


            updateStats();

        }


        function updateStats() {

            const total =
                currentClassName
                    ? (
                        allData[
                            currentClassName
                        ]
                            ? allData[
                                currentClassName
                            ].length
                            : 0
                    )
                    : 0;


            document
                .getElementById(
                    'statTotal'
                )
                .innerText =
                total;


            document
                .getElementById(
                    'statRemaining'
                )
                .innerText =
                remaining.length;

        }


        function createSparkles() {

            const bag =
                document.getElementById(
                    'magicBag'
                );


            let bagX =
                bag.offsetLeft +
                (
                    bag.offsetWidth / 2
                );


            let bagY =
                bag.offsetTop +
                (
                    bag.offsetHeight / 2
                );


            for (
                let i = 0;
                i < 30;
                i++
            ) {

                const s =
                    document.createElement(
                        'div'
                    );


                s.className =
                    'sparkle';


                s.style.left =
                    bagX + 'px';


                s.style.top =
                    bagY + 'px';


                s.style.width =
                    (
                        Math.random() * 6 +
                        4
                    ) + 'px';


                s.style.height =
                    s.style.width;


                s.style.setProperty(
                    '--x',
                    (
                        Math.random() -
                        0.5
                    ) * 350 + 'px'
                );


                s.style.setProperty(
                    '--y',
                    (
                        Math.random() -
                        0.5
                    ) * 350 + 'px'
                );


                document.body.appendChild(
                    s
                );


                setTimeout(
                    () => s.remove(),
                    1000
                );

            }

        }


        function summon() {

            if (isLayoutMode)
                return;


            if (!currentClassName)
                return alert(
                    "Manage Lists -> Select a Class"
                );


            if (remaining.length === 0)
                return alert(
                    "The bag is empty!"
                );


            const bag =
                document.getElementById(
                    'magicBag'
                );


            const display =
                document.getElementById(
                    'resultDisplay'
                );


            display.style.transition =
                "none";


            display.style.opacity =
                "0";


            let bagX =
                bag.offsetLeft +
                (
                    bag.offsetWidth / 2
                );


            let bagY =
                bag.offsetTop +
                (
                    bag.offsetHeight / 2
                );


            let targetX =
                parseFloat(
                    display.style.left
                ) ||
                (
                    window.innerWidth /
                    2
                );


            let targetY =
                parseFloat(
                    display.style.top
                ) ||
                (
                    window.innerHeight *
                    0.22
                );


            let travelX =
                bagX - targetX;


            let travelY =
                bagY - targetY;


            display.style.transform =
                `translate(
                    calc(-50% + ${travelX}px),
                    calc(-50% + ${travelY}px)
                ) scale(0)`;


            bag.classList.add(
                'shaking'
            );


            playMagicSound();


            setTimeout(() => {

                bag.classList.remove(
                    'shaking'
                );


                createSparkles();


                const idx =
                    Math.floor(
                        Math.random() *
                        remaining.length
                    );


                const picked =
                    remaining[idx];


                if (removeMode)
                    remaining.splice(
                        idx,
                        1
                    );


                display.innerText =
                    picked;


                requestAnimationFrame(
                    () => {

                        display.style.transition =
                            "transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s linear";


                        display.style.transform =
                            "translate(-50%, -50%) scale(1)";


                        display.style.opacity =
                            "1";

                    }
                );


                updateStats();

            }, 2500);

        }


        window.addEventListener(
            'resize',
            applySavedPositions
        );


        init();

    </script>

</body>
</html>
